<!-- Event snippet for "Book appointment (2)" now lives on obrigado.html
     (thank-you page). It was firing here on every homepage load before,
     which counted every visitor as a conversion — moved so it only

<!-- ============================================================
     LISA BEAUTY - GOOGLE ADS CONVERSION TRACKING (v2)
     1) gtag_report_conversion : fires click conversions safely (beacon)
     2) Enhanced Conversions   : SHA-256 hashed email/phone (Step 3)
     3) Booking widget listener: redirects to thank-you page (Step 1)
     ============================================================ -->
<script>
/* ----------------------------------------------------------
   1) CLICK CONVERSIONS (WhatsApp buttons)
   FIX: the old version used event_callback + window.location,
   which navigated the CURRENT tab even though the link already
   opened WhatsApp in a NEW tab (target="_blank"). Result:
   WhatsApp opened twice and hits were sometimes lost.
   'transport_type: beacon' guarantees the hit is delivered
   even if the browser navigates away immediately (fixes
   "conversion loss" on iPhone/Safari).
   ---------------------------------------------------------- */
function gtag_report_conversion(url) {
  // Conversion 1: WhatsApp button click
  gtag('event', 'conversion', {
    'send_to': 'AW-18205632597/nLTXCN_f57kcENXQj-1D',
    'transport_type': 'beacon'
  });
  // Conversion 2: Contact (1)
  gtag('event', 'conversion', {
    'send_to': 'AW-18205632597/2NX9CL6IxbocENXQj-lD',
    'value': 1.0,
    'currency': 'EUR',
    'transport_type': 'beacon'
  });
  return true; // let the link's default behavior open WhatsApp normally
}

/* ----------------------------------------------------------
   2) ENHANCED CONVERSIONS HELPERS (Step 3)
   Google requires data to be NORMALIZED then SHA-256 hashed:
   - email : trim + lowercase
   - phone : E.164 format (+351XXXXXXXXX) BEFORE hashing
   - names : trim + lowercase
   Hashing is done locally with the browser's Web Crypto API,
   so raw personal data never leaves the page unhashed.
   ---------------------------------------------------------- */
async function lbSha256(value) {
  const data = new TextEncoder().encode(value);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest))
    .map(b => b.toString(16).padStart(2, '0'))
    .join('');
}

function lbNormalizeEmail(email) {
  return (email || '').trim().toLowerCase();
}

// Converts Portuguese phone inputs to E.164 (+351...) -> required by Google
function lbNormalizePhone(phone) {
  let digits = (phone || '').replace(/[^0-9+]/g, '');
  if (digits.startsWith('00')) digits = '+' + digits.slice(2);   // 00351... -> +351...
  if (!digits.startsWith('+')) {
    if (digits.length === 9) digits = '+351' + digits;           // 9XXXXXXXX -> +3519XXXXXXXX
    else if (digits.startsWith('351')) digits = '+' + digits;    // 351... -> +351...
    else if (digits.length > 0) digits = '+' + digits;
  }
  return digits.length >= 10 ? digits : '';
}

/* Builds the hashed user_data object and gives it to gtag.
   Returns the object so it can also be saved for the thank-you page. */
async function lbSetEnhancedUserData(fields) {
  const userData = {};
  const email = lbNormalizeEmail(fields.email);
  if (email && email.includes('@')) {
    userData.sha256_email_address = await lbSha256(email);
  }
  const phone = lbNormalizePhone(fields.phone);
  if (phone) {
    userData.sha256_phone_number = await lbSha256(phone);
  }
  const name = (fields.name || '').trim().toLowerCase();
  if (name) {
    const parts = name.split(/\s+/);
    userData.address = {
      sha256_first_name: await lbSha256(parts[0]),
      sha256_last_name: await lbSha256(parts[parts.length - 1]),
      country: 'PT'
    };
  }
  if (Object.keys(userData).length > 0) {
    gtag('set', 'user_data', userData); // attaches hashed data to following events
    try { // also save it for the thank-you page conversion (same tab)
      sessionStorage.setItem('lb_user_data', JSON.stringify(userData));
    } catch (e) {}
  }
  return userData;
}

</script>
